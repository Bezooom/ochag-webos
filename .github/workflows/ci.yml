name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: sh -n + shellcheck + contract tests (no TV needed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check (+ shellcheck report)
        run: make check
      - name: Contract tests
        run: make test
